[project]
name = "musicxml-tokenizer"
version = "0.1.0"
requires-python = "==3.12."
dependencies = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E501",
    "ANN101",
    "ANN102",
    "ANN003",
    "PLR0913"
]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "SIM",
    "ANN",
    "PLR",
    "PLE",
    "PLW",
    "PLC",
    "UP",
    "N",
    "PTH",
    "PD"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72
